syntax = "proto3";

package chat;

option java_package = "com.project.chat_server.grpc";
option java_outer_classname = "ChatProto";
option java_multiple_files = true;

service ChatService {
  rpc SendMessage (ChatMessageRequest) returns (ChatMessageResponse);
}

message ChatMessageRequest {
  int64 chatRoomId = 1;
  int64 senderId = 2;
  string senderUsername = 3;
  string content = 4;
  string createdAt = 5;
}

message ChatMessageResponse {
  bool success = 1;
}