<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>WebSocket Chat Test</title>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .container {
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 20px;
        }
        .message-area {
            height: 300px;
            overflow-y: scroll;
            border: 1px solid #ddd;
            padding: 10px;
            margin-bottom: 20px;
            background-color: #f9f9f9;
        }
        .message {
            margin: 10px 0;
            padding: 8px;
            background-color: #e3f2fd;
            border-radius: 5px;
        }
        .message.sent {
            background-color: #c8e6c9;
            text-align: right;
        }
        input, button {
            padding: 10px;
            margin: 5px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 3px;
        }
        .connected {
            background-color: #c8e6c9;
        }
        .disconnected {
            background-color: #ffcdd2;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>WebSocket Chat Test</h1>

    <div id="status" class="status disconnected">연결 안됨</div>

    <div>
        <label>Server Port: </label>
        <input type="number" id="serverPort" placeholder="8080" value="8080">

        <label>User ID: </label>
        <input type="number" id="userId" placeholder="1" value="1">

        <label>ChatRoom ID: </label>
        <input type="number" id="chatRoomId" placeholder="1" value="1">

        <button id="connectBtn" onclick="connect()">연결</button>
        <button id="disconnectBtn" onclick="disconnect()" disabled>연결 해제</button>
    </div>

    <div class="message-area" id="messageArea"></div>

    <div>
        <input type="text" id="messageInput" placeholder="메시지 입력..." style="width: 70%;" disabled>
        <button id="sendBtn" onclick="sendMessage()" disabled>전송</button>
    </div>
</div>

<script>
    let stompClient = null;
    let currentUserId = null;
    let currentChatRoomId = null;

    function connect() {
        currentUserId = document.getElementById('userId').value;
        currentChatRoomId = document.getElementById('chatRoomId').value;
        const port = document.getElementById('serverPort').value;

        const socket = new WebSocket(`ws://localhost:${port}/ws`);
        stompClient = Stomp.over(socket);
        stompClient.debug = null;

        stompClient.connect({}, function(frame) {
            console.log('Connected: ' + frame);
            updateStatus(true, port);

            stompClient.subscribe('/topic/chat/' + currentChatRoomId, function(message) {
                showMessage(JSON.parse(message.body));
            });

            addSystemMessage(`${port}번 서버 채팅방 ${currentChatRoomId}번에 입장했습니다.`);
        }, function(error) {
            console.error('Connection error: ' + error);
            updateStatus(false);
            addSystemMessage('연결 실패: ' + error);
        });
    }

    function disconnect() {
        if (stompClient !== null) {
            stompClient.disconnect();
        }
        updateStatus(false);
        addSystemMessage('연결이 해제되었습니다.');
    }

    function sendMessage() {
        const messageInput = document.getElementById('messageInput');
        const content = messageInput.value.trim();

        if (content && stompClient) {
            const message = {
                senderId: parseInt(currentUserId),
                content: content
            };

            stompClient.send('/app/chat/' + currentChatRoomId, {}, JSON.stringify(message));
            messageInput.value = '';
        }
    }

    function showMessage(message) {
        const messageArea = document.getElementById('messageArea');
        const messageElement = document.createElement('div');
        messageElement.className = 'message';

        if (message.senderId == currentUserId) {
            messageElement.classList.add('sent');
        }

        messageElement.innerHTML = `
            <strong>${message.senderUsername} (${message.senderId})</strong><br>
            ${message.content}<br>
            <small>${new Date(message.createdAt).toLocaleTimeString()}</small>
        `;

        messageArea.appendChild(messageElement);
        messageArea.scrollTop = messageArea.scrollHeight;
    }

    function addSystemMessage(text) {
        const messageArea = document.getElementById('messageArea');
        const messageElement = document.createElement('div');
        messageElement.style.color = '#666';
        messageElement.style.fontStyle = 'italic';
        messageElement.style.margin = '10px 0';
        messageElement.textContent = text;
        messageArea.appendChild(messageElement);
        messageArea.scrollTop = messageArea.scrollHeight;
    }

    function updateStatus(connected, port) {
        const statusDiv = document.getElementById('status');
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        if (connected) {
            statusDiv.textContent = `연결됨 (서버 포트: ${port})`;
            statusDiv.className = 'status connected';
            connectBtn.disabled = true;
            disconnectBtn.disabled = false;
            messageInput.disabled = false;
            sendBtn.disabled = false;
        } else {
            statusDiv.textContent = '연결 안됨';
            statusDiv.className = 'status disconnected';
            connectBtn.disabled = false;
            disconnectBtn.disabled = true;
            messageInput.disabled = true;
            sendBtn.disabled = true;
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    });
</script>
</body>
</html>
