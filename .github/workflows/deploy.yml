name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create application-secrets.properties
        run: |
          echo "${{ secrets.APPLICATION_SECRETS }}" > src/main/resources/application-secrets.properties

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Docker Hub Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker Image Build & Push
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/chat-server:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/chat-server:latest

      - name: Deploy to Server 1
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER1_IP }}
          username: root
          password: ${{ secrets.SERVER1_PASSWORD }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/chat-server:latest
            docker stop chat-server || true
            docker rm chat-server || true
            docker run -d \
              --name chat-server \
              -p 8080:8080 \
              -e SPRING_PROFILES_ACTIVE=prod \
              ${{ secrets.DOCKER_USERNAME }}/chat-server:latest

      - name: Deploy to Server 2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER2_IP }}
          username: root
          password: ${{ secrets.SERVER2_PASSWORD }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/chat-server:latest
            docker stop chat-server || true
            docker rm chat-server || true
            docker run -d \
              --name chat-server \
              -p 8080:8080 \
              -e SPRING_PROFILES_ACTIVE=prod \
              ${{ secrets.DOCKER_USERNAME }}/chat-server:latest